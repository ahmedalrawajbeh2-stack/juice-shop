name: Semgrep SAST

on:
  push:

jobs:
  semgrep:
    name: Run Semgrep SAST scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep and print results to console
        run: semgrep scan --config auto --verbose